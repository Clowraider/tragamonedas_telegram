# ==============================================================================
# Prometheus Configuration for Slot Machine MVP
# Collects private operational and business metrics from Fastify API
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "slot-machine-api"
    metrics_path: "/metrics"
    scheme: "http"
    scrape_interval: 10s
    static_configs:
      - targets:
          - "api:3000"
        labels:
          service: "slot-machine-api"
          environment: "production"
